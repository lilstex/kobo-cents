[project]
name = "kobo-and-cents-backend"
version = "0.1.0"
description = "Kobo & Cents backend: NGX and US stock research, never a trading platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.17",
    "posthog>=3.7",
    "httpx>=0.27",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in a default argument) is bugbear's general-
# Python catch for a real footgun, but it's also exactly the pattern
# FastAPI's own dependency injection is built around, Depends(...) in
# a default argument is correct and idiomatic here, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine in app.db.session is a module-level singleton, its
# connection pool has to live on one event loop for the whole test
# run, not get torn down and recreated per test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
