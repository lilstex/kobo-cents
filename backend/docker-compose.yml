services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kobo
      POSTGRES_PASSWORD: kobo
      POSTGRES_DB: kobo_dev
    ports:
      # 5433 on the host: a native Postgres already commonly sits on
      # 5432 on this dev machine, same conflict hit and fixed the same
      # way in the previous version of this project.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    # Overrides .env's host-facing DATABASE_URL/REDIS_URL: inside the
    # compose network, the other services are reachable by service
    # name, not localhost, and not the host-mapped port.
    environment:
      DATABASE_URL: postgresql+asyncpg://kobo:kobo@postgres:5432/kobo_dev
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.workers.celery worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kobo:kobo@postgres:5432/kobo_dev
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
